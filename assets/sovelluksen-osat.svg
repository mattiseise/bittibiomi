<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc">
<title id="title">Miten teemapaketin osat liittyvät toisiinsa?</title>
<desc id="desc">Havainnekuva teemapaketin osista, ei kuvakaappaus. Vasemmalla työkalut: Piskelillä piirretään tekstuurit PNG-kuviksi, Blockbenchillä tehdään 3D-mallit ja niiden .bbmodel-lähdetiedostot, Audacityllä ääni muunnetaan ogg-muotoon ja VS Codella kirjoitetaan JSON- ja mcfunction-tiedostot. Työkalujen tulokset tallennetaan julkiseen repositoryyn GitHubissa. Repositoryssa on resourcepack-kansio, joka muuttaa pelin ilmettä ja ääntä (textures/block, textures/item, models/block, lang/fi_fi.json, oman nimiavaruuden äänet ja sounds.json sekä pack.mcmeta ja pack.png), datapack-kansio, joka lisää säännöt (oman nimiavaruuden recipe-, advancement- ja function-kansiot, load.json ja pack.mcmeta), project-docs-kansio arviointia varten (suunnitelma, päiväkirja ja testaus.md) sekä README, LICENSE, CREDITS ja CHANGELOG. Oikealla Minecraft Java: resurssipaketti luetaan pelin resourcepacks-kansiosta, ja se näyttää tekstuurit, mallit ja nimet ja soittaa äänen. Datapaketti luetaan maailman datapacks-kansiosta: resepti työpöydällä laukaisee saavutuksen, ja saavutus ajaa palkintofunktion. Alhaalla GitHub-release v1.0 jakaa lataajalle kaksi zipiä ja README-ohjeen, joilla kuka tahansa asentaa paketin. Työn aikana kopioit kansiot itse peliin ja testaat jokaisen muutoksen.</desc>
<rect width="880" height="640" fill="#ffffff"/>
<defs>
  <marker id="nuoli" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5c5347"/></marker>
</defs>
<text x="28" y="44" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Miten teemapaketin osat liittyvät toisiinsa?</text>
<text x="28" y="70" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="15">Havainnekuva, ei kuvakaappaus valmiista paketista</text>

