<text x="468" y="328" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">näkyvät, ja oma</text>
<text x="468" y="348" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">ääni kuuluu</text>

