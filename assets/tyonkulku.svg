<text x="54" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text>
<text x="82" y="133" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Lataa</text>
<rect x="46" y="158" width="152" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="58" y="178" fill="#1b5e20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Release v1.0</text>
