<text x="44" y="288" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">GitHub-release v1.0:</text>
<text x="44" y="308" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">kaksi zip-pakettia</text>
<text x="44" y="328" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">ja README-ohje</text>

