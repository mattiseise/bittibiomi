<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc">
<title id="title">Näin pelaaja käyttää valmista teemapakettia</title>
<desc id="desc">Havainnekuva pelaajan työnkulusta neljänä numeroituna vaiheena, ei kuvakaappaus. 1 Lataa: pelaaja avaa julkisen GitHub-releasen v1.0 ja lataa kaksi zip-pakettia ja README-ohjeen. 2 Asenna: resurssipaketti menee pelin resourcepacks-kansioon ja datapaketti maailman datapacks-kansioon, ja pelin kieleksi vaihdetaan suomi. 3 Pelaa: pelissä näkyvät omat tekstuurit, 3D-malli ja suomenkieliset nimet, ja paketin oma ääni kuuluu. 4 Valmista: pelaaja valmistaa teeman reseptin työpöydällä, saavutus laukeaa ja palkintofunktio antaa palkinnon. Alarivi: avoin lisenssi, LICENSE ja CREDITS kertovat, mitä toinen tekijä saa paketilla tehdä.</desc>
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="nuoli" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5c5347"/></marker>
</defs>
<text x="28" y="44" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Näin pelaaja käyttää valmista teemapakettia</text>
<text x="28" y="70" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="15">Havainnekuva pelaajan työnkulusta, ei kuvakaappaus valmiista paketista</text>

<!-- 1 Lataa -->
