<svg xmlns="http://www.w3.org/2000/svg" width="880" height="874" viewBox="0 0 880 874" role="img" aria-labelledby="title desc">
<title id="title">BittiBiomi: projektin vaiheet</title>
<desc id="desc">1. Valmistelu ja rajaus (viikot 34–35): Selvität toimeksiannon, teet tyhjän paketin, joka näkyy pelissä, ja perustat julkisen repositoryn. Asset-pack-suunnitelma, lisenssi ja GitHub-issueiksi pilkottu sisältö rajaavat paketin ennen ensimmäistä pikseliä. 2. Paketin ilme ja ääni (viikot 36–40): Piirrät blokki- ja esinetekstuurit, annat sisällölle omat nimet, mallinnat Blockbenchillä ja lisäät äänen. Jokainen asset kulkee saman asset-työkierron läpi, ja resurssipaketti on koossa ennen katselmointia. 3. Palaute ja pelillinen lisä (viikot 41–44): Testaajat kokeilevat väliversiota, ja teet heidän palautteestaan sovitun muutoksen omassa haarassa. Datapaketti tuo reseptin, saavutuksen ja palkintofunktion, joten paketin koko pakollinen sisältö on valmis. Syysloma · viikko 42. 4. Testaus ja laatu (viikot 45–46): Testaat koko paketin kirjatuilla testitapauksilla, korjaat kolme virhettä ketjuna ja siistit rakenteen. Lisenssi ja lähteet tarkistetaan, jotta paketin saa julkaista avoimena. 5. Julkaisu ja näyttö (viikot 47–49): Kaksi testaajaa asentaa julkaisuehdokkaan pelkän ohjeen avulla, ja v1.0 julkaistaan GitHub-releasena. Lopuksi kokoat näyttöaineiston ja esittelet työsi demossa.</desc>
<rect width="880" height="874" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Mitä syntyy missäkin vaiheessa?</text>
<rect x="90" y="78" width="752" height="132" rx="12" fill="#ffffff" stroke="#8d5a2b" stroke-width="2"/>
<circle cx="45" cy="107" r="24" fill="#8d5a2b"/>
<text x="45" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">1</text>
<text x="112" y="114" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Valmistelu ja rajaus</text>
<text x="822" y="114" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 34–35</text>
<text x="112" y="150" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kysymykset → tyhjä paketti → repository → suunnitelma</text>
<text x="112" y="180" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Rajaus on hyväksytty ja tyhjä paketti näkyy pelissä.</text>
<path d="M45 136V224" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="230" width="752" height="132" rx="12" fill="#ffffff" stroke="#1a6fae" stroke-width="2"/>
<circle cx="45" cy="259" r="24" fill="#1a6fae"/>
<text x="45" y="269" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="266" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Paketin ilme ja ääni</text>
<text x="822" y="266" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 36–40</text>
<text x="112" y="302" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Tekstuurit → nimet → mallit → ääni</text>
<text x="112" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Peli näyttää ja kuulostaa sinun teemaltasi.</text>
<path d="M45 288V376" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="382" width="752" height="162" rx="12" fill="#ffffff" stroke="#c03434" stroke-width="2"/>
<circle cx="45" cy="411" r="24" fill="#c03434"/>
<text x="45" y="421" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text>
<text x="112" y="418" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Palaute ja pelillinen lisä</text>
<text x="822" y="418" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 41–44</text>
<text x="112" y="454" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Väliversio testiin → palautemuutos → datapaketti</text>
<text x="112" y="484" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Resepti avaa saavutuksen: pakollinen sisältö on koossa.</text>
<text x="112" y="518" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic">Syysloma · viikko 42</text>
<path d="M45 440V558" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="564" width="752" height="132" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="45" cy="593" r="24" fill="#7c3aed"/>
<text x="45" y="603" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">4</text>
<text x="112" y="600" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Testaus ja laatu</text>
<text x="822" y="600" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 45–46</text>
<text x="112" y="636" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Testitapaukset → korjausketjut → rakenne ja lisenssi</text>
<text x="112" y="666" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Paketti kestää käyttöä, ja sen saa julkaista.</text>
<path d="M45 622V710" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="716" width="752" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<circle cx="45" cy="745" r="24" fill="#0f766e"/>
<text x="45" y="755" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text>
<text x="112" y="752" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Julkaisu ja näyttö</text>
<text x="822" y="752" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 47–49</text>
<text x="112" y="788" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuehdokas → v1.0-release → näyttö</text>
<text x="112" y="818" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kuka tahansa voi ladata ja asentaa paketin.</text>
</svg>
